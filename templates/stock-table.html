<script type="text/x-template" id="tpl-stock">

<div>

  <h3 class="mb-4">
    Stok Bahan Ajar
  </h3>

  <!-- FILTER -->

  <div class="row mb-3">

    <div class="col-md-3">

      <input
        type="text"
        class="form-control"
        v-model="search"
        placeholder="Cari buku..."
      >

    </div>

    <div class="col-md-3">

      <select
        class="form-select"
        v-model="selectedUPBJJ"
      >

        <option value="">
          Semua UPBJJ
        </option>

        <option
          v-for="(upbjj,index) in upbjjList"
          :key="index"
        >
          {{ upbjj }}
        </option>

      </select>

    </div>

    <div class="col-md-3">

      <select
        class="form-select"
        v-model="selectedKategori"
        v-show="selectedUPBJJ"
      >

        <option value="">
          Semua Kategori
        </option>

        <option
          v-for="(kategori,index) in kategoriList"
          :key="index"
        >
          {{ kategori }}
        </option>

      </select>

    </div>

    <div class="col-md-3">

      <select
        class="form-select"
        v-model="sortBy"
      >

        <option value="">
          Sort
        </option>

        <option value="judul">
          Judul
        </option>

        <option value="harga">
          Harga
        </option>

        <option value="qty">
          Stok
        </option>

      </select>

    </div>

  </div>

  <!-- CHECKBOX -->

  <div class="mb-3">

    <input
      type="checkbox"
      v-model="showWarning"
    >

    Tampilkan stok warning

    <button
      class="btn btn-secondary btn-sm ms-3"
      @click="resetFilter"
    >
      Reset
    </button>

  </div>

  <!-- FORM TAMBAH -->

  <div class="card mb-4">

    <div class="card-body">

      <h5>Tambah Bahan Ajar</h5>

      <div class="row">

        <div class="col-md-3">

          <input
            type="text"
            class="form-control"
            v-model="newItem.kode"
            placeholder="Kode"
          >

        </div>

        <div class="col-md-3">

          <input
            type="text"
            class="form-control"
            v-model="newItem.judul"
            placeholder="Judul"
            @keyup.enter="addItem"
          >

        </div>

        <div class="col-md-2">

          <input
            type="number"
            class="form-control"
            v-model="newItem.qty"
            placeholder="Qty"
          >

        </div>

        <div class="col-md-2">

          <input
            type="number"
            class="form-control"
            v-model="newItem.harga"
            placeholder="Harga"
          >

        </div>

        <div class="col-md-2">

          <button
            class="btn btn-success w-100"
            @click="addItem"
          >
            Tambah
          </button>

        </div>

      </div>

    </div>

  </div>

  <!-- TABLE -->

  <table class="table table-bordered table-hover">

    <thead class="table-dark">

      <tr>

        <th>Kode</th>
        <th>Judul</th>
        <th>Kategori</th>
        <th>UPBJJ</th>
        <th>Harga</th>
        <th>Qty</th>
        <th>Status</th>
        <th>Aksi</th>

      </tr>

    </thead>

    <tbody>

      <tr
        v-for="(item,index) in filteredStock"
        :key="index"
      >

        <td>{{ item.kode }}</td>

        <td>{{ item.judul }}</td>

        <td>{{ item.kategori }}</td>

        <td>{{ item.upbjj }}</td>

        <td>
          Rp {{ formatHarga(item.harga) }}
        </td>

        <td>
          {{ item.qty }} buah
        </td>

        <td>

          <span
            :title="removeHTML(item.catatanHTML)"
          >

            <status-badge
              :qty="item.qty"
              :safety="item.safety"
            ></status-badge>

          </span>

        </td>

        <td>

          <button
            class="btn btn-danger btn-sm"
            @click="confirmDelete(index)"
          >
            Delete
          </button>

        </td>

      </tr>

    </tbody>

  </table>

  <!-- MODAL -->

  <app-modal
    v-if="showModal"
    message="Yakin ingin menghapus data?"
    @close="showModal=false"
    @confirm="deleteItem"
  ></app-modal>

</div>

</script>
