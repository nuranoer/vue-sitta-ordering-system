<script type="text/x-template" id="tpl-order">

<div>

  <h3 class="mb-4">
    Form Pemesanan
  </h3>

  <div class="card">

    <div class="card-body">

      <div class="mb-3">

        <label>Paket</label>

        <select
          class="form-select"
          v-model="selectedPaket"
        >

          <option value="">
            Pilih Paket
          </option>

          <option
            v-for="(item,index) in paket"
            :key="index"
            :value="item"
          >
            {{ item.kode }} - {{ item.nama }}
          </option>

        </select>

      </div>

      <div
        v-if="selectedPaket"
        class="alert alert-info"
      >

        <p>
          Harga:
          Rp {{ formatHarga(selectedPaket.harga) }}
        </p>

        <ul>

          <li
            v-for="(isi,index) in selectedPaket.isi"
            :key="index"
          >
            {{ isi }}
          </li>

        </ul>

      </div>

      <div class="mb-3">

        <label>Ekspedisi</label>

        <select
          class="form-select"
          v-model="selectedPengiriman"
        >

          <option
            v-for="(item,index) in pengirimanList"
            :key="index"
          >
            {{ item.nama }}
          </option>

        </select>

      </div>

      <button
        class="btn btn-success"
        @click="submitOrder"
      >
        Pesan
      </button>

    </div>

  </div>

</div>

</script>
