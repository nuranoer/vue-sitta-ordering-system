<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>SITTA Vue 2</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
  >

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  >

</head>

<body>

<div id="app">

  <nav class="navbar navbar-dark bg-dark navbar-expand-lg">

    <div class="container">

      <a class="navbar-brand">
        SITTA UT
      </a>

      <div>

        <button
          class="btn btn-light me-2"
          @click="tab='stok'"
        >
          Stok
        </button>

        <button
          class="btn btn-warning"
          @click="tab='tracking'"
        >
          Tracking
        </button>

        <button
          class="btn btn-success"
          @click="tab='order'"
        >
          Order
        </button>

      </div>

    </div>

  </nav>

  <div class="container mt-4">

    <stock-table
      v-if="tab=='stok'"
      :stok="stok"
      :upbjj-list="upbjjList"
      :kategori-list="kategoriList"
    ></stock-table>

    <do-tracking
      v-if="tab=='tracking'"
      :tracking="tracking"
    ></do-tracking>

    <order-form
      v-if="tab=='order'"
      :paket="paket"
      :pengiriman-list="pengirimanList"
    ></order-form>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

<!-- Templates -->
<script src="templates/stock-table.html"></script>
<script src="templates/stock-table.html"></script>
<script src="templates/order-form.html"></script>
<script src="templates/do-tracking.html"></script>
<script src="templates/app-modal.html"></script>
<script src="templates/status-badge.html"></script>

<script src="js/services/api.js"></script>

<script src="js/components/status-badge.js"></script>
<script src="js/components/app-modal.js"></script>
<script src="js/components/stock-table.js"></script>
<script src="js/components/do-tracking.js"></script>
<script src="js/components/order-form.js"></script>

<script src="js/app.js"></script>


</body>
</html>
